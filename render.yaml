services:
  - type: web
    name: pmc-backend
    runtime: docker
    buildCommand: docker build -t pmc-backend .
    startCommand: /entrypoint.sh
    # WebSocket support configuration
    websocketSupport: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: USE_POSTGRESQL
        value: True
      - key: DB_NAME
        fromDatabase:
          name: pmc-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pmc-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pmc-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: pmc-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pmc-db
          property: port
      - key: CORS_ALLOW_ALL_ORIGINS
        value: False
      - key: CORS_ALLOW_CREDENTIALS
        value: True
      - key: CSRF_COOKIE_SECURE
        value: True
      - key: CSRF_COOKIE_HTTPONLY
        value: False
      - key: CSRF_USE_SESSIONS
        value: False
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      # Email configuration
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        value: your-email@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: your-email@gmail.com
      - key: REDIS_URL
        fromDatabase:
          name: pmc-redis
          property: connectionString
  - type: worker
    name: pmc-worker
    runtime: docker
    buildCommand: docker build -t pmc-backend .
    startCommand: celery -A backend worker --pool=solo --loglevel=info --without-gossip --without-mingle --without-heartbeat
    envVars:
       - key: SECRET_KEY
         generateValue: true
       - key: DEBUG
         value: False
       - key: ALLOWED_HOSTS
         value: .onrender.com
       - key: USE_POSTGRESQL
         value: True
       - key: DB_NAME
         fromDatabase:
           name: pmc-db
           property: database
       - key: DB_USER
         fromDatabase:
           name: pmc-db
           property: user
       - key: DB_PASSWORD
         fromDatabase:
           name: pmc-db
           property: password
       - key: DB_HOST
         fromDatabase:
           name: pmc-db
           property: host
       - key: DB_PORT
         fromDatabase:
           name: pmc-db
           property: port
       - key: CORS_ALLOW_ALL_ORIGINS
         value: False
       - key: CORS_ALLOW_CREDENTIALS
         value: True
       - key: CSRF_COOKIE_SECURE
         value: True
       - key: CSRF_COOKIE_HTTPONLY
         value: False
       - key: CSRF_USE_SESSIONS
         value: False
       - key: DJANGO_SUPERUSER_USERNAME
         value: admin
       - key: DJANGO_SUPERUSER_EMAIL
         value: admin@example.com
       - key: DJANGO_SUPERUSER_PASSWORD
         generateValue: true
       # Email configuration
       - key: EMAIL_HOST
         value: smtp.gmail.com
       - key: EMAIL_PORT
         value: 587
       - key: EMAIL_USE_TLS
         value: True
       - key: EMAIL_HOST_USER
         value: your-email@gmail.com
       - key: EMAIL_HOST_PASSWORD
         value: your-app-password
       - key: DEFAULT_FROM_EMAIL
         value: your-email@gmail.com
       - key: REDIS_URL
         fromDatabase:
           name: pmc-redis
           property: connectionString
       - key: BASE_URL
         fromService:
           type: web
           name: pmc-backend
           property: host

databases:
  - name: pmc-db
    databaseName: pmc_db
    user: postgres
    plan: free
  - name: pmc-redis
    redis:
      plan: free
