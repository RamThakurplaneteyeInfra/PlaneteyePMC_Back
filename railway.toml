# Railway Config-as-Code — Backend (web) service
# Leave Start Command empty in the dashboard so entrypoint.sh runs Daphne.
# Do NOT set SERVICE_ROLE=worker on this service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Restarts on crash (Railway default behavior reinforced)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
